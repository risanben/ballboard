<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mister Balls</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body onkeyup="onHandleKey(event)" onload="onInitGame()">

    <h1>Collect those Balls</h1>
    <h2 class="modal balls-count">Balls Collected: <span>0</span></h2>
    <h2 class="negs-counter"> Neighbors balls: <span>0</span></h2>
    <div class="victory-container">
        <h1 class="victory hide">YOU WON!!!</h1>
    </div>

    <table class="board">
        <tbody></tbody>
    </table>

    <button class="restart hide" onclick="onInitGame()">Restart</button>

    <script src="js/util.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
